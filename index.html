<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Treningslogg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Treningslogg</title>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Treningslogg</h1>
      <p id="statusLine">Klar for neste økt</p>
    </div>
    <button id="installHelpBtn" class="ghost small">Installer</button>
  </header>

  <main id="app" class="app-shell">
    <nav class="tabs" aria-label="Hovedmeny">
      <button data-tab="programs" class="tab active">Program</button>
      <button data-tab="workout" class="tab">Økt</button>
      <button data-tab="history" class="tab">Historikk</button>
      <button data-tab="progress" class="tab">Progresjon</button>
      <button data-tab="settings" class="tab">Data</button>
    </nav>

    <section id="programs" class="view active"></section>
    <section id="workout" class="view"></section>
    <section id="history" class="view"></section>
    <section id="progress" class="view"></section>
    <section id="settings" class="view"></section>
  </main>

  <dialog id="modal"><form method="dialog" id="modalForm"><div id="modalBody"></div></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
